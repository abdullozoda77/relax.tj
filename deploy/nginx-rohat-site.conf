# Rohat site, shared by its nginx server blocks (installed as /etc/nginx/snippets/rohat-site.conf).
# The React site from frontend/dist, the API and admin from gunicorn (127.0.0.1:8031), photos and styles from disk.

client_max_body_size 20M;  # photos in reviews and place suggestions

# Compress text files: the JS goes from about 4.8 MB to 1.3 MB, so pages open much faster on mobile data.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

root /home/romin/rohat/frontend/dist;
index index.html;

location /static/ {
    alias /home/romin/rohat/static/;
    expires 30d;
}

location /media/ {
    alias /home/romin/rohat/media/;
    expires 7d;
}

location ~ ^/(api|admin|swagger|redoc)(/|$) {
    proxy_pass http://127.0.0.1:8031;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;  # the AI assistant can think for up to a minute
}

# Built JS/CSS files have a hash in their names, so browsers may keep them for a long time.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Cesium's workers, images and styles (about 8 MB) change only with a new Cesium version: browsers keep them.
location /cesium/ {
    expires 30d;
    try_files $uri =404;
}

# Every other address is a page of the React app (/places/5, /profile…).
location / {
    try_files $uri $uri/ /index.html;
}
